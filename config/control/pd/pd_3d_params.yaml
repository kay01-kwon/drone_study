# Nominal Parameters

dynamic_params:
  m: 2.9  # Mass [kg]
  MoiArray: [0.06, 0.06, 0.09]  # Moment of inertia [kg*m^2]
  com_offset: [-0.01, 0.005, 0.0]  # Center of mass offset [m]

drone_params:
  arm_length: 0.265  # Arm length [m]
  motor_const: 1.465e-7  # Motor thrust constant
  moment_const: 0.01569  # Motor moment constant

rotor_params:
  p: [25.16687, 0.003933, 515.605]  # Rotor model parameters
  w_rotor_min: 2000  # Minimum rotor speed [RPM]
  w_rotor_max: 7200  # Maximum rotor speed [RPM]
  alpha_rotor_max: 15000  # Maximum rotor acceleration [RPM/s]
  jerk_rotor_max: 250000  # Maximum rotor jerk [RPM/s^2]
  num_rotors: 6  # Number of rotors

gain_params:
  KpPosArray: [2.0, 2.0, 8.0]  # Position proportional gain (optimized for 0.3 m/s)
  KdPosArray: [1.5, 1.5, 5,0]  # Position derivative gain (increased damping)
  KiPosArray: [0.1, 0.1, 0.1]  # Position integral gain
  ITransLimit: [1.0, 1.0, 1.0]  # Translation integral limit
  KpOriArray: [10.5, 10.5, 1.0]  # Orientation proportional gain (optimized)
  KdOriArray: [5.5, 5.5, 0.5]  # Orientation derivative gain (increased damping)
  KiOriArray: [0.01, 0.01, 0.01]  # Orientation integral gain
  IOriLimit: [1.0, 1.0, 1.0]  # Orientation integral limit
  AccelMax: [1.0, 2.0]  # Maximum acceleration [m/s^2]

  regulation:
    setpoint_position: [ 0.0, 1.0 ]  # [x, z] target [m]

  tracking:
    target_position: [ 0.0, 1.0 ]  # [x, z] target [m]
    a_max: 13.0                  # Max total acceleration (thrust/mass) [m/s^2], must > g
    a_min: 1.0                   # Min total acceleration [m/s^2]
    omega_xy_max: 10.0            # Max angular rate [rad/s] - limits jerk
    time_scale: 1.0              # Trajectory time stretch factor (1.0 = original, slower = larger)
    replan_freq: 100           # Trajectory replanning frequency [Hz]